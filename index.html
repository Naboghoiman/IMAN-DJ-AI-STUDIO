<!DOCTYPE html>
<html>
<head>

<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎧 IMAN DJ AI STUDIO</h1>

<p>RCF STYLE DIGITAL DJ SYSTEM</p>

</header>



<nav>

<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY/REC</button>
<button>METERS</button>
<button>LOAD/SAVE</button>
<button>SETTINGS</button>

</nav>



<section class="panel">

<h2>DUAL DECK SYSTEM</h2>


<div class="decks">


<!-- DECK A -->

<div class="deck">

<h2>DECK A</h2>

<div class="jog">
A
</div>


<div class="wave">
WAVEFORM A
</div>


<h3 id="trackA">
NO TRACK
</h3>


<input 
type="file"
accept="audio/*"
onchange="loadA(this.files[0])">


<div class="buttons">

<button onclick="playA()">▶</button>

<button onclick="pauseA()">Ⅱ</button>

<button onclick="stopA()">■</button>

</div>


<h3>
BPM: <span id="bpmA">128</span>
</h3>


<label>PITCH</label>

<input 
type="range"
min="0.5"
max="2"
step="0.01"
value="1"
oninput="pitchA(this.value)">



<label>VOLUME</label>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeA(this.value)">



</div><!-- DECK B -->

<div class="deck">

<h2>DECK B</h2>


<div class="jog">
B
</div>


<div class="wave">
WAVEFORM B
</div>


<h3 id="trackB">
NO TRACK
</h3>


<input 
type="file"
accept="audio/*"
onchange="loadB(this.files[0])">


<div class="buttons">

<button onclick="playB()">▶</button>

<button onclick="pauseB()">Ⅱ</button>

<button onclick="stopB()">■</button>

</div>


<h3>
BPM: <span id="bpmB">128</span>
</h3>


<label>PITCH</label>

<input 
type="range"
min="0.5"
max="2"
step="0.01"
value="1"
oninput="pitchB(this.value)">



<label>VOLUME</label>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeB(this.value)">



</div>


</div>

</section>



<!-- MIXER -->

<section class="panel">

<h2>MIXER</h2>


<label>
CROSS FADER
</label>


<input 
type="range"
min="0"
max="1"
step="0.01">



<label>
MASTER
</label>


<input 
type="range"
min="0"
max="1"
step="0.01"
value="1">


</section>



<!-- EFFECTS -->

<section class="panel">

<h2>RCF EFFECTS RACK</h2>


<div class="effect">

<h3>HALL REVERB</h3>

<input type="range">

<button onclick="toggleReverb()">
POWER
</button>

</div>


<div class="effect">

<h3>DIGITAL DELAY</h3>

<input type="range">

<button onclick="toggleDelay()">
POWER
</button>

</div>


<div class="effect">

<h3>FILTER</h3>

<input type="range">

<button onclick="toggleFilter()">
POWER
</button>

</div>


</section>
  <!-- 31 BAND GRAPHIC EQ -->

<section class="panel">


<h2>
31 BAND GRAPHIC EQ
</h2>


<div class="eq">


<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">

<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">
<input type="range" min="-12" max="12" value="0">

</div>


</section>





<!-- MASTER OUTPUT -->


<section class="panel">


<h2>
MASTER OUTPUT
</h2>


<div class="master-meter">

</div>


</section>





<script src="app.js"></script>


</body>

  </html>
