
<!DOCTYPE html>
<html>
<head>

<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
🎧 IMAN DJ AI STUDIO
</header>


<nav>
<button>FADERS</button>
<button>EFFECTS</button>
<button>EQUALIZER</button>
<button>SETTINGS</button>
</nav>



<div class="decks">


<!-- DECK A -->

<section class="deck">

<h2>DECK A</h2>

<div class="display" id="trackA">
NO TRACK
</div>


<input type="file" accept="audio/*" onchange="loadTrackA(event)">



<div class="buttons">

<button onclick="playA()">▶</button>
<button onclick="pauseA()">⏸</button>
<button onclick="stopA()">⏹</button>

</div>


<h3>BPM</h3>
<div id="bpmA">128</div>


<h3>KEY</h3>

<input class="slider"
type="range"
min="-12"
max="12"
value="0"
oninput="keyA(this.value)">



<h3>VOLUME</h3>

<input class="slider"
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeA(this.value)">


</section>





<!-- DECK B -->


<section class="deck">

<h2>DECK B</h2>


<div class="display" id="trackB">
NO TRACK
</div>


<input type="file" accept="audio/*" onchange="loadTrackB(event)">



<div class="buttons">

<button onclick="playB()">▶</button>
<button onclick="pauseB()">⏸</button>
<button onclick="stopB()">⏹</button>

</div>



<h3>BPM</h3>
<div id="bpmB">128</div>



<h3>KEY</h3>

<input class="slider"
type="range"
min="-12"
max="12"
value="0"
oninput="keyB(this.value)">



<h3>VOLUME</h3>

<input class="slider"
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeB(this.value)">


</section>


</div>




<!-- MIXER -->


<section class="mixer">


<h2>MIXER</h2>


<h3>CROSS FADER</h3>

<input class="cross"
type="range"
min="0"
max="1"
step="0.01"
value="0.5"
oninput="crossfade(this.value)">



<button onclick="syncDecks()">
SYNC BEATS
</button>



<h2>31 BAND EQUALIZER</h2>


<div class="eq">


<script>

let freq=[
"20Hz","50Hz","100Hz","250Hz",
"500Hz","1kHz","2kHz","5kHz",
"10kHz","20kHz"
];


freq.forEach((f,i)=>{

document.write(`

<div class="band">

<label>${f}</label>

<input 
type="range"
min="-12"
max="12"
value="0"
oninput="changeEQ(${i},this.value)">

</div>

`);

});


</script>


</div>


</section>




<script src="app.js"></script>


</body>

</html>
