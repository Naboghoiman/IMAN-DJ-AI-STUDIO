<!DOCTYPE html>
<html>

<head>

<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎧 IMAN DJ AI STUDIO</h1>

<p>RCF STYLE DIGITAL MIXER</p>

</header>




<nav class="top-menu">

<button onclick="showPanel('faders')">
FADERS
</button>

<button onclick="showPanel('effects')">
EFFECTS
</button>

<button onclick="showPanel('outputs')">
OUTPUTS
</button>

<button onclick="showPanel('meters')">
METERS
</button>

<button onclick="showPanel('settings')">
SETTINGS
</button>

</nav>







<main>



<!-- DECK SYSTEM -->


<section class="panel">


<h2>DUAL DECK SYSTEM</h2>



<div class="deck-container">





<!-- DECK A -->


<div class="deck">


<h2>DECK A</h2>



<div class="jog">

<div class="jog-center">
A
</div>

</div>




<div class="waveform">

WAVEFORM A

</div>



<div id="trackA">

NO TRACK

</div>



<input 
type="file"
accept="audio/*"
onchange="loadTrackA(event)">





<div class="audio-controls">


<button onclick="playA()">
▶
</button>


<button onclick="pauseA()">
⏸
</button>


<button onclick="stopA()">
■
</button>



</div>





<button>
CUE
</button>


<button onclick="sync()">
SYNC
</button>





<h3>
BPM:
<span id="bpmA">
128
</span>
</h3>




<label>
PITCH
</label>

<input 
type="range"
min="0.5"
max="1.5"
step="0.01"
oninput="pitchA(this.value)">





<label>
VOLUME
</label>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeA(this.value)">





</div>








<!-- MIXER -->

<div class="mixer">


<h2>
MIXER
</h2>


<label>
CROSS FADER
</label>


<input
type="range"
min="0"
max="1"
step="0.01"
value="0.5"
oninput="setCross(this.value)">



<label>
MASTER
</label>


<input
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="setMaster(this.value)">



</div>
<!-- DECK B -->


<div class="deck">


<h2>DECK B</h2>



<div class="jog">

<div class="jog-center">
B
</div>

</div>



<div class="waveform">

WAVEFORM B

</div>



<div id="trackB">

NO TRACK

</div>



<input 
type="file"
accept="audio/*"
onchange="loadTrackB(event)">





<div class="audio-controls">


<button onclick="playB()">
▶
</button>


<button onclick="pauseB()">
⏸
</button>


<button onclick="stopB()">
■
</button>


</div>





<button>
CUE
</button>



<button onclick="sync()">
SYNC
</button>





<h3>
BPM:
<span id="bpmB">
128
</span>
</h3>




<label>
PITCH
</label>


<input 
type="range"
min="0.5"
max="1.5"
step="0.01"
oninput="pitchB(this.value)">





<label>
VOLUME
</label>


<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeB(this.value)">



</div>



</div>


</section>







<!-- EFFECTS -->


<section id="effects" class="panel">


<h2>
RCF EFFECTS RACK
</h2>



<div class="effect-unit">

<h3>
HALL REVERB
</h3>


<label>DECAY</label>
<input type="range">


<label>SPACE</label>
<input type="range">


<button>
ON
</button>


</div>





<div class="effect-unit">

<h3>
DIGITAL DELAY
</h3>


<label>TIME</label>
<input type="range">


<label>FEEDBACK</label>
<input type="range">


<button>
ON
</button>


</div>





<div class="effect-unit">

<h3>
VALVE WARMER
</h3>

<input type="range">

<button>
ON
</button>


</div>




<div class="effect-unit">

<h3>
XCITER
</h3>

<input type="range">

<button>
ON
</button>


</div>





<div class="effect-unit">

<h3>
MAXIMIZER
</h3>

<input type="range">

<button>
ON
</button>


</div>



</section>







<!-- EQUALIZER -->


<section class="panel">


<h2>
31 BAND GRAPHIC EQ
</h2>


<div class="eq-container">


<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">


</div>


</section>






<!-- OUTPUT -->


<section class="panel">


<h2>
MASTER OUTPUT
</h2>


<div class="meter">

<div class="level"></div>

</div>


<input
type="range"
oninput="setMaster(this.value)">



</section>





</main>



<script src="app.js"></script>


</body>

  </html>
