<!DOCTYPE html>
<html>
<head>
<title>IMAN DJ AI STUDIO</title>
    <link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.decks{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.deck{
    background:#181818;
    border-radius:15px;
    padding:20px;
    width:350px;
    box-shadow:0 0 15px #000;
}

h2{
    text-align:center;
}

.screen{
    height:120px;
    background:#000;
    border:2px solid #333;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00ff99;
    font-size:20px;
}

button{
    background:#00aa66;
    border:none;
    color:white;
    padding:12px;
    margin:5px;
    border-radius:8px;
}

.slider{
    width:100%;
}

.mixer{
    margin-top:30px;
    background:#151515;
    padding:20px;
    border-radius:15px;
}

.eq{
    display:flex;
    justify-content:center;
    gap:10px;
}

.eq input{
    height:150px;
    writing-mode:bt-lr;
    transform:rotate(-90deg);
}

.channel{
    margin:20px;
}

</style>

</head>

<body>

<header>
🎧 IMAN DJ AI STUDIO
</header>


<div class="container">


<div class="decks">


<div class="deck">

<h2>DECK A</h2>

<div class="screen">
TRACK A
</div>

<input type="file">

<br>

<button>▶ PLAY</button>
<button>⏸ PAUSE</button>

<p>Volume</p>
<input class="slider" type="range">


<p>Key Control</p>
<input class="slider" type="range">

</div>



<div class="deck">

<h2>DECK B</h2>

<div class="screen">
TRACK B
</div>

<input type="file">

<br>

<button>▶ PLAY</button>
<button>⏸ PAUSE</button>

<p>Volume</p>
<input class="slider" type="range">


<p>Key Control</p>
<input class="slider" type="range">

</div>


</div>



<div class="mixer">

<h2>MASTER MIXER</h2>


<p>Crossfader</p>
<input class="slider" type="range">


<h2>Equalizer</h2>


<div class="eq">

<input type="range" min="-12" max="12">
<input type="range" min="-12" max="12">
<input type="range" min="-12" max="12">
<input type="range" min="-12" max="12">
<input type="range" min="-12" max="12">

</div>


</div>


</div>
<script src="app.js"></script>
</body>
</html>
