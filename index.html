<!DOCTYPE html>
<html>
<head>
<title>IMAN DJ AI STUDIO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎧 IMAN DJ AI STUDIO</h1>
<p>RCF STYLE DIGITAL MIXER</p>
</header>


<nav>

<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY/REC</button>
<button>METERS</button>
<button>LOAD/SAVE</button>
<button>SETTINGS</button>

</nav>


<main>


<section class="panel">

<h2>DUAL DECK SYSTEM</h2>

<div class="deck-container">


<div class="deck">

<h2>DECK A</h2>

<div class="track-display">
TRACK A
</div>

<input type="file">

<div class="audio-controls">
<button>▶</button>
<button>⏸</button>
<button>■</button>
</div>


<h3>BPM 128</h3>

<label>PITCH</label>
<input type="range">


<label>VOLUME</label>
<input type="range">


<button>CUE</button>

</div>




<div class="deck">

<h2>DECK B</h2>

<div class="track-display">
TRACK B
</div>


<input type="file">


<div class="audio-controls">
<button>▶</button>
<button>⏸</button>
<button>■</button>
</div>


<h3>BPM 128</h3>

<label>PITCH</label>
<input type="range">


<label>VOLUME</label>
<input type="range">


<button>CUE</button>


</div>


</div>

</section>





<section class="panel">

<h2>MIXER</h2>


<div class="mixer">


<div class="channel">
<h3>CHANNEL A</h3>
<input class="vertical" type="range">
</div>


<div class="channel">
<h3>CHANNEL B</h3>
<input class="vertical" type="range">
</div>


<div class="channel">
<h3>CROSS FADER</h3>
<input type="range">
</div>


<div class="channel">
<h3>MASTER</h3>
<input type="range">
</div>


</div>


</section>






<section class="panel effects">


<h2>RCF EFFECTS RACK</h2>


<div class="effect-unit">

<h3>HALL REVERB</h3>

<label>PRE DELAY</label>
<input type="range">

<label>DECAY</label>
<input type="range">

<label>DAMPING</label>
<input type="range">

<button>ON</button>

</div>




<div class="effect-unit">

<h3>DIGITAL DELAY</h3>

<label>TIME</label>
<input type="range">

<label>FEEDBACK</label>
<input type="range">

<label>WIDTH</label>
<input type="range">

<button>ON</button>

</div>




<div class="effect-unit">

<h3>VALVE WARMER</h3>

<input type="range">

<button>ON</button>

</div>



<div class="effect-unit">

<h3>XCITER</h3>

<input type="range">

<button>ON</button>

</div>



<div class="effect-unit">

<h3>MAXIMIZER</h3>

<input type="range">

<button>ON</button>

</div>


</section>





<section class="panel">


<h2>31 BAND GRAPHIC EQ</h2>


<div class="eq">

<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">
<input type="range">

</div>


</section>





<section class="panel">

<h2>MASTER OUTPUT</h2>

<div class="meter">

<div class="level"></div>

</div>


<input type="range">


</section>




</main>


<script src="app.js"></script>

</body>
</html>
