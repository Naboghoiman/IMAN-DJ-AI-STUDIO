<!DOCTYPE html>
<html>
<head>
<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
🎧 IMAN DJ AI STUDIO
</header>


<div class="top-menu">

<button>FADERS</button>
<button>EFFECTS</button>
<button>EQUALIZER</button>
<button>SETTINGS</button>

</div>


<div class="main-container">


<!-- DECK A -->

<div class="deck">

<h2>DECK A</h2>

<div class="display">

TRACK A

</div>


<input type="file" id="fileA" accept="audio/*" onchange="loadTrackA(event)">


<div class="controls">

<button onclick="playA()">▶ PLAY</button>
<button onclick="pauseA()">⏸ PAUSE</button>

</div>


<h3>BPM</h3>
<div id="bpmA">128</div>


<h3>KEY</h3>

<input 
type="range" 
min="-12" 
max="12" 
value="0"
oninput="keyA(this.value)">


<h3>VOLUME</h3>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeA(this.value)">


</div>



<!-- DECK B -->


<div class="deck">

<h2>DECK B</h2>


<div class="display">

TRACK B

</div>


<input type="file" id="fileB" accept="audio/*" onchange="loadTrackB(event)">


<div class="controls">

<button onclick="playB()">▶ PLAY</button>
<button onclick="pauseB()">⏸ PAUSE</button>

</div>


<h3>BPM</h3>
<div id="bpmB">128</div>


<h3>KEY</h3>

<input 
type="range"
min="-12"
max="12"
value="0"
oninput="keyB(this.value)">


<h3>VOLUME</h3>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="volumeB(this.value)">


</div>
    <!-- MASTER MIXER -->

<div class="mixer">

<h2>MASTER MIXER</h2>


<h3>CROSSFADER</h3>

<input 
class="cross"
type="range"
min="0"
max="1"
step="0.01"
value="0.5"
oninput="crossfade(this.value)">


<div class="master-controls">


<div>
<h3>MASTER VOLUME</h3>

<input 
type="range"
min="0"
max="1"
step="0.01"
value="1">
</div>


<div>
<h3>SYNC</h3>

<button onclick="syncDecks()">
SYNC
</button>

</div>


</div>



<!-- 31 BAND EQUALIZER -->

<h2>GRAPHIC EQUALIZER</h2>


<div class="equalizer">


<div>
<label>20</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>50</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>100</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>250</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>500</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>1K</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>2K</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>5K</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>10K</label>
<input type="range" min="-12" max="12">
</div>


<div>
<label>20K</label>
<input type="range" min="-12" max="12">
</div>


</div>


</div>


<script src="app.js"></script>


</body>

    </html>
