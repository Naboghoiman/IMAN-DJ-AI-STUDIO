<!DOCTYPE html>
<html>

<head>

<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>


<header>
🎧 IMAN DJ AI STUDIO
</header>


<nav class="top-menu">

<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY/REC</button>
<button>METERS</button>
<button>LOAD/SAVE</button>
<button>SETTINGS</button>

</nav>



<main class="console">



<!-- DECK A -->

<section class="deck">

<h2>DECK A</h2>


<div class="screen" id="trackA">
NO TRACK
</div>


<input type="file" accept="audio/*" onchange="loadTrack('A',this)">



<div class="transport">

<button onclick="playTrack('A')">▶</button>
<button onclick="pauseTrack('A')">⏸</button>
<button onclick="stopTrack('A')">■</button>

</div>



<div class="display-box">

BPM

<strong id="bpmA">
128
</strong>

</div>



<label>KEY</label>

<input type="range" min="-12" max="12">



<label>PITCH</label>

<input type="range" min="-8" max="8">



<label>CHANNEL VOLUME</label>

<input type="range"
min="0"
max="100"
value="80"
oninput="setVolume('A',this.value)">



<div class="meter">

<div class="level"></div>

</div>


</section>





<!-- CENTER MIXER -->

<section class="mixer">

<h2>MIXER</h2>


<h3>GAIN</h3>
<input type="range">


<h3>LOW</h3>
<input type="range">


<h3>MID</h3>
<input type="range">


<h3>HIGH</h3>
<input type="range">


<h3>CROSS FADER</h3>

<input type="range">


<button onclick="sync()">
SYNC
</button>


</section>
  <!-- DECK B -->


<section class="deck">


<h2>DECK B</h2>


<div class="screen" id="trackB">

NO TRACK

</div>



<input type="file" accept="audio/*" onchange="loadTrack('B',this)">



<div class="transport">

<button onclick="playTrack('B')">▶</button>
<button onclick="pauseTrack('B')">⏸</button>
<button onclick="stopTrack('B')">■</button>

</div>



<div class="display-box">

BPM

<strong id="bpmB">
128
</strong>

</div>



<label>KEY</label>

<input type="range" min="-12" max="12">



<label>PITCH</label>

<input type="range" min="-8" max="8">



<label>CHANNEL VOLUME</label>

<input type="range"
min="0"
max="100"
value="80"
oninput="setVolume('B',this.value)">



<div class="meter">

<div class="level"></div>

</div>



</section>







<!-- EFFECTS RACK -->


<section class="effects">


<h2>EFFECTS RACK</h2>



<div class="effect-module">

<h3>HALL REVERB</h3>


<label>PRE DELAY</label>
<input type="range">


<label>DECAY</label>
<input type="range">


<label>SPACE</label>
<input type="range">


<button>ON</button>


</div>





<div class="effect-module">


<h3>DIGITAL DELAY</h3>


<label>TIME</label>
<input type="range">


<label>FEEDBACK</label>
<input type="range">


<label>FILTER</label>
<input type="range">


<button>ON</button>


</div>





<div class="effect-module">


<h3>VALVE WARMER</h3>


<label>DRIVE</label>
<input type="range">


<button>ON</button>


</div>





<div class="effect-module">


<h3>XCITER</h3>


<label>PROCESS</label>
<input type="range">


<button>ON</button>


</div>





<div class="effect-module">


<h3>MAXIMIZER</h3>


<label>BOOST</label>
<input type="range">


<label>CEILING</label>
<input type="range">


<button>ON</button>


</div>


  </section>
  <!-- GRAPHIC EQUALIZER -->


<section class="equalizer">


<h2>31 BAND GRAPHIC EQ</h2>


<div class="eq-container">


<div class="eq-band">
<label>20</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>31</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>63</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>125</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>250</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>500</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>1k</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>2k</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>4k</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>8k</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>16k</label>
<input type="range" min="-12" max="12">
</div>


<div class="eq-band">
<label>20k</label>
<input type="range" min="-12" max="12">
</div>



</div>


</section>







<!-- MASTER OUTPUT -->


<section class="master">


<h2>MASTER OUTPUT</h2>


<div class="master-meter">

<div class="level"></div>

</div>



<label>MASTER VOLUME</label>

<input type="range">



</section>




</main>




<script src="app.js"></script>


</body>

</html>
