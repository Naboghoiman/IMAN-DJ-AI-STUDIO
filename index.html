<!DOCTYPE html>
<html>
<head>
<title>IMAN DJ AI STUDIO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎧 IMAN DJ AI STUDIO</h1>
<p>RCF STYLE DIGITAL DJ SYSTEM</p>
</header>


<nav>
<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY/REC</button>
<button>METERS</button>
<button>LOAD/SAVE</button>
<button>SETTINGS</button>
</nav>


<section class="rack">

<h2>DUAL DECK SYSTEM</h2>


<div class="decks">


<div class="deck">

<h2>DECK A</h2>

<div class="jog">
A
</div>

<div class="wave">
WAVEFORM A
</div>

<h3 id="nameA">NO TRACK</h3>

<input type="file" id="fileA" accept="audio/*">

<br>

<button onclick="playA()">▶</button>
<button onclick="pauseA()">Ⅱ</button>
<button onclick="stopA()">■</button>


<h3>BPM: 128</h3>

<label>PITCH</label>
<input type="range">

<label>VOLUME</label>
<input type="range">


<audio id="audioA"></audio>

</div>




<div class="deck">

<h2>DECK B</h2>

<div class="jog">
B
</div>


<div class="wave">
WAVEFORM B
</div>

<h3 id="nameB">NO TRACK</h3>

<input type="file" id="fileB" accept="audio/*">

<br>

<button onclick="playB()">▶</button>
<button onclick="pauseB()">Ⅱ</button>
<button onclick="stopB()">■</button>


<h3>BPM: 128</h3>


<label>PITCH</label>
<input type="range">


<label>VOLUME</label>
<input type="range">


<audio id="audioB"></audio>

</div>


</div>

</section>



<section class="rack">

<h2>MIXER</h2>

<label>CROSS FADER</label>
<input type="range">

<label>MASTER</label>
<input type="range">


</section>




<section class="rack">

<h2>RCF EFFECTS RACK</h2>


<div class="effect">

<h3>HALL REVERB</h3>

<input type="range">

<button>ON</button>

</div>


<div class="effect">

<h3>DIGITAL DELAY</h3>

<input type="range">

<button>ON</button>

</div>


<div class="effect">

<h3>FILTER</h3>

<input type="range">

<button>ON</button>

</div>


<div class="effect">

<h3>MAXIMIZER</h3>

<input type="range">

<button>ON</button>

</div>


</section>





<section class="rack">

<h2>31 BAND GRAPHIC EQ</h2>

<div class="eq">

<script>
for(let i=0;i<31;i++){
document.write('<input type="range" orient="vertical">');
}
</script>

</div>


</section>





<section class="rack">

<h2>MASTER OUTPUT</h2>

<div class="meter"></div>


</section>


<script src="script.js"></script>

</body>
</html>
