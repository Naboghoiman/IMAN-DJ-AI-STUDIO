<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IMAN DJ AI STUDIO</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎧 IMAN DJ AI STUDIO</h1>

<p>RCF STYLE DIGITAL DJ SYSTEM</p>

</header>



<nav>

<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY/REC</button>
<button>METERS</button>
<button>LOAD/SAVE</button>
<button>SETTINGS</button>

</nav>



<div class="container">



<section class="rack">


<h2>DUAL DECK SYSTEM</h2>



<div class="decks">



<div class="deck">


<h2>DECK A</h2>


<div class="platter">
A
</div>


<div class="waveform">
WAVEFORM A
</div>


<h3 id="trackA">
NO TRACK
</h3>


<input type="file" id="fileA" accept="audio/*">


<br><br>


<button onclick="playA()">▶</button>

<button onclick="pauseA()">Ⅱ</button>

<button onclick="stopA()">■</button>



<h3>BPM:128</h3>



<label>PITCH</label>

<input type="range" min="-10" max="10">



<label>VOLUME</label>

<input type="range" min="0" max="100">



<audio id="audioA"></audio>


</div>





<div class="deck">


<h2>DECK B</h2>


<div class="platter">
B
</div>



<div class="waveform">
WAVEFORM B
</div>


<h3 id="trackB">
NO TRACK
</h3>


<input type="file" id="fileB" accept="audio/*">


<br><br>


<button onclick="playB()">▶</button>

<button onclick="pauseB()">Ⅱ</button>

<button onclick="stopB()">■</button>



<h3>BPM:128</h3>



<label>PITCH</label>

<input type="range" min="-10" max="10">



<label>VOLUME</label>

<input type="range" min="0" max="100">



<audio id="audioB"></audio>


</div>



</div>


</section>
