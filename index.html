<!DOCTYPE html>
<html>

<head>

<title>IMAN DJ AI STUDIO</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

🎧 IMAN DJ AI STUDIO

</header>



<!-- TOP RACK MENU -->

<div class="rack-menu">

<button>FADERS</button>
<button>EFFECTS</button>
<button>OUTPUTS</button>
<button>PHONES</button>
<button>PLAY / REC</button>
<button>METERS</button>
<button>LOAD / SAVE</button>
<button>SETTINGS</button>

</div>





<!-- MAIN CONSOLE -->


<div class="console">



<!-- DECK A -->


<div class="channel">


<h2>DECK A</h2>


<div class="screen">

TRACK A

</div>


<input type="file" accept="audio/*" onchange="loadTrackA(event)">



<div class="buttons">

<button onclick="playA()">▶</button>
<button onclick="pauseA()">⏸</button>
<button onclick="stopA()">■</button>

</div>



<div class="meter">

<div class="level"></div>

</div>



<label>BPM</label>

<div class="display-value">

128

</div>



<label>KEY</label>

<input type="range" min="-12" max="12">



<label>PITCH</label>

<input type="range" min="-8" max="8">



<label>VOLUME</label>

<input type="range"
oninput="volumeA(this.value)">



</div>







<!-- CENTRAL MIXER -->


<div class="mixer-panel">


<h2>MIXER</h2>



<div class="knobs">


<div>
GAIN
<input type="range">
</div>


<div>
LOW
<input type="range">
</div>


<div>
MID
<input type="range">
</div>


<div>
HIGH
<input type="range">
</div>


</div>




<h3>CROSS FADER</h3>


<input class="crossfader"
type="range"
min="0"
max="1"
step="0.01"
oninput="crossfade(this.value)">





<button onclick="syncDecks()">

SYNC

</button>


</div>






<!-- DECK B -->


<div class="channel">


<h2>DECK B</h2>


<div class="screen">

TRACK B

</div>


<input type="file" accept="audio/*" onchange="loadTrackB(event)">



<div class="buttons">

<button onclick="playB()">▶</button>
<button onclick="pauseB()">⏸</button>
<button onclick="stopB()">■</button>

</div>



<div class="meter">

<div class="level"></div>

</div>



<label>BPM</label>

<div class="display-value">

128

</div>



<label>KEY</label>

<input type="range" min="-12" max="12">



<label>PITCH</label>

<input type="range" min="-8" max="8">



<label>VOLUME</label>

<input type="range"
oninput="volumeB(this.value)">



</div>



</div>






<!-- EQUALIZER -->

<section class="equalizer-panel">


<h2>31 BAND GRAPHIC EQUALIZER</h2>


<div class="eq-sliders">


<script>

let bands=[
"20Hz",
"31Hz",
"63Hz",
"125Hz",
"250Hz",
"500Hz",
"1kHz",
"2kHz",
"4kHz",
"8kHz",
"16kHz",
"20kHz"
];


bands.forEach(function(b){

document.write(

`
<div class="eq-band">

<span>${b}</span>

<input 
type="range"
min="-12"
max="12">

</div>
`

);

});

</script>


</div>


</section>






<!-- MASTER -->


<section class="master">


<h2>MASTER OUTPUT</h2>


<div class="master-meter">

</div>


<label>MASTER VOLUME</label>


<input type="range">



</section>





<script src="app.js"></script>


</body>


</html>
